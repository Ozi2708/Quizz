name: Essai de rendu

# Essai seulement (branche essai/rendu) : rend le court du quiz Seigneur des anneaux
# avec les mêmes étapes que le workflow de publication, puis une publication à blanc.
on:
  push:
    branches: ["essai/**"]

jobs:
  rendu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUIZ: quizzes/le-seigneur-des-anneaux-10q-2d94ab.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ffmpeg et numpy (assemblage, bande son, porte 2)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy
      - run: npm ci
      - name: Installer Chromium pour le rendu
        run: npx playwright install --with-deps chromium
      - name: Rendu du court
        run: time npm run -s rendu -- "$QUIZ"
      - name: Publication à blanc
        run: |
          id=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.QUIZ, "utf8")).id')
          npm run -s publier -- "$QUIZ" --video "sortie/$id-court.mp4" --plateformes youtube,tiktok,instagram --a-blanc
