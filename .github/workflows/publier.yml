name: Publier un quiz

# Lancement manuel depuis l'onglet Actions (une fois sur main) : rendu du court, portes 1 et 2,
# puis publication via Upload-Post. Le job attend ton feu vert si l'environnement
# « publication » exige un relecteur (Settings, Environments).
on:
  workflow_dispatch:
    inputs:
      quiz:
        description: Fichier du quiz vérifié, ex. quizzes/capitales-d-europe-10q-8a6a39.json
        required: true
      plateformes:
        description: Plateformes séparées par des virgules (youtube, tiktok, instagram)
        required: true
        default: youtube,tiktok
      prive:
        description: Essai privé (YouTube en privé, TikTok visible par toi seul, pas d'Instagram)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: publication
    env:
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ vars.UPLOAD_POST_USER }}
      QUIZ: ${{ inputs.quiz }}
      PLATEFORMES: ${{ inputs.plateformes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ffmpeg et numpy (assemblage, bande son, porte 2)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy
      - run: npm ci
      - name: Installer Chromium pour le rendu
        run: npx playwright install --with-deps chromium
      - name: Rendu du court
        run: npm run -s rendu -- "$QUIZ"
      - name: Publication
        run: |
          id=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.QUIZ, "utf8")).id')
          npm run -s publier -- "$QUIZ" --video "sortie/$id-court.mp4" --plateformes "$PLATEFORMES" ${{ inputs.prive && '--prive' || '' }}
      # Le statut « publie » alimente le contrôle anti-doublon des prochains quiz.
      - name: Enregistrer le statut publié
        if: ${{ !inputs.prive && !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$QUIZ"
          # stats.yml commite aussi sur main : on se remet à jour avant de pousser.
          git diff --cached --quiet || { git commit -m "Quiz publié : $QUIZ" && git pull --rebase origin main && git push; }
